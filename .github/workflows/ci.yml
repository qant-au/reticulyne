name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main
  # release.yml calls this workflow with run-e2e: true, so a tag cannot
  # publish unless the full gate, e2e included, is green (BLD-08).
  workflow_call:
    inputs:
      run-e2e:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        # Fail CI on any moderate-or-higher advisory in the production
        # dependency graph. Low-severity advisories are reported by
        # `npm audit` but allowed through the gate; the accepted set is
        # listed in SECURITY.md and must be re-audited there before any
        # new low-severity entry is allowed to land.
        #
        # `--omit=dev` excludes devDependencies so a transitive jest /
        # webpack-dev-server advisory doesn't block the build — those
        # are tracked separately in SECURITY.md.
        run: npm audit --omit=dev --audit-level=moderate

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - name: Verify pack contents
        # Allowed top-level roots and dist/ file types (SEC-05) live in
        # scripts/check-pack-contents.mjs, shared with release.yml.
        run: node scripts/check-pack-contents.mjs

  # End-to-end (Playwright) — label-gated, mandatory on release.
  #
  # Runs when the triggering commit message (push) or PR title
  # (pull_request) contains the literal string `[run e2e]`, and always
  # when release.yml calls this workflow (inputs.run-e2e). The intent
  # is opt-in day to day: most PRs don't touch the editor's interactive
  # surface, so paying ~3 minutes per run is reserved for the changes
  # that do. The job builds both Docker images (editor on :2222,
  # examples picker on :2223), starts them on the runner, and points
  # Playwright at them.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    if: >-
      inputs.run-e2e ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[run e2e]')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[run e2e]'))
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build reticulyne Docker images
        run: |
          docker build -t reticulyne .
          docker build -t reticulyne-examples \
            --build-arg WEBPACK_SCRIPT=docker:examples:build \
            --build-arg DIST_DIR=dist-docker-examples .

      - name: Start reticulyne containers
        # examples-picker and multi-select specs need the examples bundle
        # on :2223 (it is the one that loads a diagram); the rest use :2222.
        run: |
          docker run -d --rm --name reticulyne -p 2222:8080 reticulyne
          docker run -d --rm --name reticulyne-examples -p 2223:8080 reticulyne-examples
          for port in 2222 2223; do
            ok=0
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:$port/" > /dev/null; then
                echo "container responding on :$port"
                ok=1
                break
              fi
              sleep 1
            done
            if [ "$ok" != 1 ]; then
              echo "container on :$port did not respond within 30s" >&2
              docker logs reticulyne >&2 || true
              docker logs reticulyne-examples >&2 || true
              exit 1
            fi
          done

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:2222

      - name: Stop reticulyne containers
        if: always()
        run: docker rm -f reticulyne reticulyne-examples || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-out/
          retention-days: 7
