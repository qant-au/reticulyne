name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # Fails fast, before any build, when the tag and the package disagree.
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches package.json version (BLD-05)
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)." >&2
            echo "Run npm version <x.y.z> --no-git-tag-version, commit, then tag." >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json"

      - name: CHANGELOG has a section for this version (BLD-06)
        run: |
          version="$(node -p "require('./package.json').version")"
          if ! grep -qF "## [$version] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$version] - <date>' section." >&2
            echo "Move the [Unreleased] entries under a dated heading for $version." >&2
            exit 1
          fi
          echo "CHANGELOG.md has a section for $version"

  # The same gate as a push to main, with e2e forced on (BLD-08).
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      run-e2e: true
    permissions:
      contents: read

  publish:
    needs: [metadata, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@qant-au"

      - run: npm ci

      - name: Audit production dependencies
        # Gate the release on the same advisory bar as CI: fail on any
        # moderate-or-higher advisory in the production dependency graph.
        # Low-severity advisories are tracked in SECURITY.md; `--omit=dev`
        # excludes devDependencies so a transitive jest / webpack-dev-server
        # advisory doesn't block publish.
        run: npm audit --omit=dev --audit-level=moderate

      # Lint and unit tests already ran in the `ci` job, and run again in
      # `npm publish` via prepublishOnly (BLD-01). Build here only because
      # the pack-contents check below needs dist/.
      - run: npm run build

      - name: Verify pack contents
        # Same check as CI: scripts/check-pack-contents.mjs.
        run: node scripts/check-pack-contents.mjs

      - run: npm publish
        env:
          # The committed .npmrc authenticates GitHub Packages via ${GITHUB_TOKEN}
          # (the @qant-au ecosystem convention), so the publish step must expose
          # that name — not just NODE_AUTH_TOKEN — or npm sends an empty token and
          # GitHub Packages returns E401. Both are set so setup-node's userconfig
          # (NODE_AUTH_TOKEN) and the project .npmrc (GITHUB_TOKEN) agree.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
