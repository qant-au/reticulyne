name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@qant-au"

      - run: npm ci

      - name: Audit production dependencies
        # Gate the release on the same advisory bar as CI: fail on any
        # moderate-or-higher advisory in the production dependency graph.
        # Low-severity advisories are tracked in SECURITY.md; `--omit=dev`
        # excludes devDependencies so a transitive jest / webpack-dev-server
        # advisory doesn't block publish.
        run: npm audit --omit=dev --audit-level=moderate

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - name: Verify pack contents
        # Mirror CI's tarball check so a drifted `files` field or a
        # `tsconfig.build.json` exclude regression can't publish test
        # fixtures, vendor code, or example components.
        run: |
          npm pack --dry-run --json > pack-report.json
          node -e "
            const r = JSON.parse(require('fs').readFileSync('pack-report.json', 'utf8'));
            const files = (r[0]?.files ?? []).map((f) => f.path);
            const allowedTop = new Set(['dist', 'README.md', 'LICENSE', 'package.json']);
            const offenders = files.filter((p) => !allowedTop.has(p.split('/')[0]));
            if (offenders.length) {
              console.error('Unexpected files in published tarball:');
              offenders.forEach((f) => console.error('  ' + f));
              process.exit(1);
            }
            console.log('pack contents OK — ' + files.length + ' files, all under allowed roots');
          "

      - run: npm publish
        env:
          # The committed .npmrc authenticates GitHub Packages via ${GITHUB_TOKEN}
          # (the @qant-au ecosystem convention), so the publish step must expose
          # that name — not just NODE_AUTH_TOKEN — or npm sends an empty token and
          # GitHub Packages returns E401. Both are set so setup-node's userconfig
          # (NODE_AUTH_TOKEN) and the project .npmrc (GITHUB_TOKEN) agree.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
