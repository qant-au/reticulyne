name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # Fails fast, before any build, when the tag and the package disagree.
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches package.json version (BLD-05)
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)." >&2
            echo "Run npm version <x.y.z> --no-git-tag-version, commit, then tag." >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json"

      - name: CHANGELOG has a section for this version (BLD-06)
        run: |
          version="$(node -p "require('./package.json').version")"
          if ! grep -qF "## [$version] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$version] - <date>' section." >&2
            echo "Move the [Unreleased] entries under a dated heading for $version." >&2
            exit 1
          fi
          echo "CHANGELOG.md has a section for $version"

  # The same gate as a push to main, with e2e forced on (BLD-08).
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      run-e2e: true
    permissions:
      contents: read

  # Publishes to npm once the metadata and the full gate pass, through npm
  # Trusted Publishing: no token, the package trusts this workflow on npmjs.com.
  publish:
    needs: [metadata, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: node scripts/check-pack-contents.mjs
      # A re-pushed or re-run tag whose version is already on npm has nothing to
      # publish: succeed without publishing instead of failing on "cannot
      # publish over".
      - name: Skip when this version is already on npm
        id: published
        run: |
          spec="$(node -p "const p=require('./package.json'); p.name+'@'+p.version")"
          if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
            echo "$spec is already on npm; nothing to publish."
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.already != 'true'
        run: npm install -g npm@^11.5.1
      - if: steps.published.outputs.already != 'true'
        run: npm publish --provenance --access public
